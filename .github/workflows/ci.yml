name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install genvm-linter==0.11.0
      - run: python3 STEPORDER_KILLSET_CHECK.py contracts/StepOrder.py
      - run: python3 -m genvm_linter.cli lint contracts/StepOrder.py
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:source
